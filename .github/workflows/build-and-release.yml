name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag 名（如 v2.0.0）；留空则只构建不发布'
        required: false
        default: ''
      publish:
        description: '创建 GitHub Release（需填写 tag）'
        type: boolean
        default: false
      use_changelog:
        description: '用 CHANGELOG.md 对应版本段落作为 Release 正文（不勾则用 GitHub 自动生成的 notes）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  # 日常：分支推送与 PR 只验证，不打包
  test:
    name: Test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Core tests and static checks
        run: ./gradlew :core:test :core:pmdMain :core:cpdCheck --no-daemon

      - name: Publish core to mavenLocal
        run: ./gradlew :core:publishToMavenLocal --no-daemon

      - name: Generate platform projects
        run: ./gradlew :tool:version-generator:run --args="$PWD" --no-daemon

      - name: Compile Paper
        run: |
          set -euo pipefail
          cd platforms/paper/paper-*/
          ../../../gradlew compileJava --no-daemon

      - name: Compile Velocity
        run: |
          set -euo pipefail
          cd platforms/velocity/velocity-*/
          ../../../gradlew compileJava --no-daemon

  # 打 tag 或手动触发：构建两个插件包
  package:
    name: Package plugins
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve target ref
        id: resolve
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build core
        run: ./gradlew :core:build :core:publishToMavenLocal --no-daemon

      - name: Generate platform projects
        run: ./gradlew :tool:version-generator:run --args="$PWD" --no-daemon

      - name: Build Paper
        run: |
          set -euo pipefail
          cd platforms/paper/paper-*/
          ../../../gradlew build --no-daemon

      - name: Build Velocity
        run: |
          set -euo pipefail
          cd platforms/velocity/velocity-*/
          ../../../gradlew build --no-daemon

      - name: Collect jars
        run: |
          set -euo pipefail
          mkdir -p dist
          cp platforms/paper/*/build/libs/YouShuiAuth-paper-*.jar dist/
          cp platforms/velocity/*/build/libs/YouShuiAuth-velocity-*.jar dist/
          ls -lh dist/

      - name: Upload Paper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YouShuiAuth-paper
          path: dist/YouShuiAuth-paper-*.jar

      - name: Upload Velocity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YouShuiAuth-velocity
          path: dist/YouShuiAuth-velocity-*.jar

  # 仅手动触发且勾选发布时执行
  release:
    name: Publish release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # 发布正文需要读取 CHANGELOG.md 与提取脚本；download-artifact 不会检出仓库，
      # 因此必须显式 checkout，并按需只取这两个路径。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            scripts
            CHANGELOG.md

      - name: Download Paper jar
        uses: actions/download-artifact@v4
        with:
          name: YouShuiAuth-paper
          path: dist

      - name: Download Velocity jar
        uses: actions/download-artifact@v4
        with:
          name: YouShuiAuth-velocity
          path: dist

      - name: Extract changelog section
        if: inputs.use_changelog
        run: python3 scripts/extract_changelog.py "${{ inputs.tag }}" > release-notes.md

      - name: Publish to GitHub Release (changelog)
        if: inputs.use_changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*.jar
          body_path: release-notes.md
          draft: false
          fail_on_unmatched_files: true

      - name: Publish to GitHub Release (auto notes)
        if: ${{ !inputs.use_changelog }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*.jar
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
