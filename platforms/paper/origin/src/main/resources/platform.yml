# 本文件由插件维护：升级时按 config-version 自动合并新配置项并备份旧文件。
config-version: "__PLATFORM_CONFIG_VERSION__"

# 实例标识：只用于实例心跳与 /ysauth instances 的展示，不参与认证判定。
# 留空会在首次启动时自动生成「平台-主机名-短码」并写回本文件；
# 也可以手工改成易读的名字（例如 paper-main），便于在多实例列表里区分。
# 修改后的影响：旧标识的心跳行会显示为 stale（7 天后自动清理），
# 玩家会话与认证状态不受影响。
deployment:
  id: ""

# 冻结隔离区：未认证玩家被固定在此点，认证后解除。
# world 留空 = 服务器默认世界；x/z 留空 = 该世界出生点；y 留空 = 该列地表高度
#（1.18+ 地表可能低至 -60，写死 64 会让玩家浮在空中）。
# 显式填写 x/z 时请确认该列有可站立方块，否则启动时会回退到出生点并告警。
quarantine:
  world: ""
  yaw: 0.0
  pitch: 0.0
  # x: 0.0
  # y: 64.0
  # z: 0.0
