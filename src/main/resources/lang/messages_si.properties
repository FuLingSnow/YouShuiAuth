# අන්තර්ගත සත්‍යාපන සේවාදායකය
embedded.status.motd=§6YouShuiAuth අන්තර්ගත සත්‍යාපනය
embedded.disconnect.invalid_forwarding=§cප්‍රොක්සියෙන් ලැබුණු ආරක්ෂිත හුවමාරුව තහවුරු කළ නොහැකි විය. පොදු ප්‍රොක්සි ලිපිනය හරහා නැවත සම්බන්ධ වන්න.
embedded.disconnect.overloaded=§cසත්‍යාපන සේවාදායකය දැනට පිරී ඇත. ටික වේලාවකින් නැවත උත්සාහ කරන්න.
embedded.disconnect.timeout=§cසත්‍යාපන සම්බන්ධතාවයේ කාලය ඉක්මවා ගියේය. නැවත සම්බන්ධ වන්න.
embedded.disconnect.unavailable=§cසත්‍යාපන සේවාදායකය තාවකාලිකව ලබා ගත නොහැක. ටික වේලාවකින් නැවත උත්සාහ කරන්න.
